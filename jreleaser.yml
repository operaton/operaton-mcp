project:
  name: operaton-mcp
  description: MCP server exposing the complete Operaton REST API as AI-callable tools
  copyright: Operaton contributors
  license: Apache-2.0
  authors:
    - Operaton contributors
  links:
    homepage: https://github.com/operaton/operaton-mcp

release:
  github:
    owner: operaton
    name: operaton-mcp
    overwrite: false
    milestone:
      name: '{{projectVersion}}'
      close: true
    issues:
      enabled: true
      comment: '🎉 This issue has been resolved in `{{tagName}}` ([Release Notes]({{releaseNotesUrl}}))'
      applyMilestone: ALWAYS
      label:
        name: released
        color: '#0E8A16'
        description: Issue has been released
    changelog:
      formatted: ALWAYS
      preset: conventional-commits
      contributors:
        format: '- {{contributorName}} ({{contributorUsernameAsLink}})'

distributions:
  operaton-mcp:
    type: FLAT_BINARY
    artifacts:
      - path: '{{projectName}}-{{projectVersion}}.tgz'
